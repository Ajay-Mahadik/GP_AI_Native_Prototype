        function App() {
            const [searchQuery, setSearchQuery] = useState("");
            const [isSearching, setIsSearching] = useState(false);
            const [results, setResults] = useState(null);
            const [errorMsg, setErrorMsg] = useState(null);

            const handleHomeClick = (e) => {
                e.preventDefault();
                setSearchQuery("");
                setResults(null);
                setErrorMsg(null);
            };

            const handleSearch = async (e, directQuery = null) => {
                if (e) e.preventDefault();
                
                const queryToSearch = directQuery || searchQuery;
                if (!queryToSearch.trim()) {
                    setResults(null);
                    setErrorMsg(null);
                    return;
                }

                setSearchQuery(queryToSearch);
                setIsSearching(true);
                setErrorMsg(null);

                const prompt = `
                You are the semantic search engine for a photo gallery. 
                Your ONLY job is to match the user's query to the correct photo IDs.

                - Rule 1: Visual Intent > EXIF Date. Do NOT rely solely on 'exif_date'.
                - Rule 2: Separate 'Events' from 'Loose Matches'. If a photo belongs to a major life event (e.g., trip, wedding, party), put its ID in 'episode_photo_ids'.
                - Rule 3: If a photo is a standalone shot, utility, meme, receipt, or everyday item, put its ID strictly in 'loose_match_ids'.
                - Rule 4: Generate 2-3 short conversational follow-up questions/filters.

                User Query: "${queryToSearch}"

                Gallery Database (JSON):
                ${JSON.stringify(GALLERY_DB, null, 2)}
                `;

                const payload = {
                    contents: [{ role: "user", parts: [{ text: prompt }] }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: { 
                            type: "OBJECT", 
                            properties: {
                                episode_photo_ids: { type: "ARRAY", items: { type: "STRING" }, description: "IDs of photos belonging to major events." },
                                loose_match_ids: { type: "ARRAY", items: { type: "STRING" }, description: "IDs of standalone, utility, or everyday photos." },
                                follow_up_filters: { type: "ARRAY", items: { type: "STRING" } }
                            },
                            required: ["episode_photo_ids", "loose_match_ids", "follow_up_filters"]
                        }
                    }
                };

                // Request is sent to the local Netlify Function
                const apiUrl = `/.netlify/functions/search`;

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) throw new Error(`API Request Failed: ${response.status}`);

                    const resultData = await response.json();
                    
                    if (resultData.candidates && resultData.candidates.length > 0) {
                        let jsonText = resultData.candidates[0].content.parts[0].text;
                        jsonText = jsonText.replace(/```json/g, '').replace(/```/g, '').trim();
                        
                        const parsedPayload = JSON.parse(jsonText);
                        
                        const rawEpisodeIds = parsedPayload.episode_photo_ids || [];
                        const rawLooseIds = parsedPayload.loose_match_ids || [];
                        
                        const groupedEpisodes = {};
                        rawEpisodeIds.forEach(id => {
                            const photo = GALLERY_DB.find(p => String(p.id) === String(id));
                            if (photo) {
                                if (!groupedEpisodes[photo.true_event]) groupedEpisodes[photo.true_event] = [];
                                groupedEpisodes[photo.true_event].push(photo.id);
                            }
                        });

                        const finalEpisodes = [];
                        const finalLooseMatches = [...rawLooseIds];

                        Object.entries(groupedEpisodes).forEach(([eventName, ids]) => {
                            if (ids.length >= 2) {
                                finalEpisodes.push({ title: eventName, photo_ids: ids });
                            } else {
                                finalLooseMatches.push(ids[0]);
                            }
                        });
                        
                        setResults({
                            episodes: finalEpisodes,
                            loose_matches: finalLooseMatches,
                            follow_up_filters: parsedPayload.follow_up_filters || []
                        });
                    }
                } catch (err) {
                    console.error("Failed to parse or fetch AI results:", err);
                    setErrorMsg("The AI Anchor encountered an issue connecting to the backend proxy.");
                    setResults(null); 
                } finally {
                    setIsSearching(false);
                }
            };

            const Sidebar = () => (

                            <Icons.Photos />
                            Photos
                        </a>
                        <a href="#" className="flex items-center gap-4 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-full font-medium transition-colors">
                            <Icons.Explore />
                            Explore
                        </a>
                        <a href="#" className="flex items-center gap-4 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-full font-medium transition-colors">
                            <Icons.Sharing />
                            Sharing
                        </a>
                        <a href="#" className="flex items-center gap-4 px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-full font-medium transition-colors">
                            <Icons.Favorites />
                            Favorites
                        </a>
                    </nav>

                    <div className="mt-auto px-4">
                        <div className="flex items-center gap-2 bg-green-50/80 px-3 py-2 rounded-lg border border-green-100/50">
                            <div className="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)] animate-pulse"></div>
                            <span className="text-xs font-medium text-green-700">Episodic AI Engine Ready</span>
                        </div>
                    </div>
                </aside>
            );

            return (
                <div className="flex h-screen bg-white font-sans text-gray-800">
                    <Sidebar />
                    
                    <main className="flex-1 flex flex-col min-w-0 overflow-hidden relative">
                        <header className="pt-4 px-4 md:px-6 flex flex-col gap-4">
                            <form onSubmit={(e) => handleSearch(e)} className="w-full max-w-3xl">
                                <div className="relative flex items-center w-full bg-[#f0f4f9] hover:bg-[#e9eef6] focus-within:bg-white focus-within:shadow-md focus-within:ring-1 focus-within:ring-gray-200 transition-all rounded-full px-2 py-2">
                                    <div className="pl-3 pr-2 text-gray-500">
                                        <Icons.Search />
                                    </div>
                                    <input
                                        type="text"
                                        placeholder="Search anything..."
                                        className="flex-1 bg-transparent border-none outline-none text-gray-700 placeholder-gray-500 text-base py-2"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        disabled={isSearching}
                                    />
                                    <button
                                        type="submit"
                                        disabled={isSearching}
                                        className="flex items-center gap-1.5 bg-[#0b57d0] hover:bg-blue-700 text-white px-4 py-2 rounded-full font-medium transition-colors text-sm shrink-0 cursor-pointer"
                                    >
                                        {isSearching ? (
                                            <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin" />
                                        ) : (
                                            <>
                                                <Icons.Sparkle /> Ask
                                            </>
                                        )}
                                    </button>
                                </div>
                            </form>

                            <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide max-w-4xl min-h-[36px]">
                                {results?.follow_up_filters && results.follow_up_filters.length > 0 && (
                                    results.follow_up_filters.map((filterText, idx) => (
                                        <button
                                            key={idx}
                                            type="button"
                                            onClick={() => handleSearch(null, filterText)}
                                            className="whitespace-nowrap flex items-center gap-2 px-4 py-1.5 bg-blue-50 text-blue-700 hover:bg-blue-100 text-sm font-medium rounded-full border border-blue-200 transition-colors cursor-pointer"
                                        >
                                            ✨ {filterText}
                                        </button>
                                    ))
                                )}
                            </div>
                        </header>

                        <div className="w-full h-px bg-gray-200 mt-2"></div>

                        <div className="flex-1 overflow-y-auto px-4 md:px-6 py-6 pb-24">
                            {errorMsg && (
                                <div className="max-w-4xl bg-red-50 text-red-700 p-4 rounded-xl border border-red-200 mb-6 flex items-center gap-3">
                                    <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd" /></svg>
                                    {errorMsg}
                                </div>
                            )}

                            {results && results.episodes.length === 0 && results.loose_matches.length === 0 ? (
                                <div className="w-full flex flex-col items-center justify-center text-gray-500 mt-20 px-4 text-center">
                                    <div className="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mb-4 text-gray-400">
                                        <Icons.Search />
                                    </div>
                                    <h3 className="text-lg font-medium text-gray-900 mb-2">No photos found</h3>
                                    <p className="text-gray-500 max-w-md">We couldn't find any events or related photos for "{searchQuery}". Try a broader search or use the filters above.</p>
                                </div>
                            ) : results ? (
                                <div className="flex flex-col gap-10 max-w-6xl">
                                    {results.episodes.length === 0 && results.loose_matches.length > 0 && (
                                        <div className="flex items-center gap-3 text-gray-700 bg-gray-50 p-4 rounded-2xl border border-gray-200 -mb-4">
                                            <svg className="w-5 h-5 text-gray-500 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                            <p className="text-sm">No specific events found for <strong>"{searchQuery}"</strong>, but we found these related individual photos.</p>
                                        </div>
                                    )}

                                    {results.episodes.length > 0 && (
                                        <div className="flex flex-col gap-10">
                                            {results.episodes.map((episode, idx) => (
                                                <div key={`episode-${episode.title}-${idx}`} className="mb-4">
                                                    <div className="flex items-center gap-3 mb-4 group w-full max-w-md cursor-text">
                                                        <input 
                                                            type="text" 
                                                            defaultValue={episode.title}
                                                            className="text-lg md:text-xl font-bold text-[#001d35] bg-transparent border-b border-transparent hover:border-gray-300 focus:border-[#0b57d0] focus:outline-none transition-colors w-full pb-1"
                                                        />
                                                        <div className="opacity-0 group-hover:opacity-100 transition-opacity">
                                                            <Icons.Edit />
                                                        </div>
                                                    </div>
                                                
                                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                                                        {episode.photo_ids.map(id => GALLERY_DB.find(p => String(p.id) === String(id))).filter(Boolean).map((photo) => {
                                                            const isMismatch = ['WhatsApp Download', 'AirDrop'].includes(photo.source);
                                                            return (
                                                                <div 
                                                                    key={`exact-${photo.id}`} 
                                                                    className={`group relative aspect-square rounded-3xl flex flex-col border transition-all duration-300 shadow-sm hover:shadow-md hover:-translate-y-1 overflow-hidden ${
                                                                        isMismatch 
                                                                            ? 'bg-gradient-to-br from-[#fffdf5] to-[#fff4d1] border-[#fce9aa] hover:border-[#facc15]/50' 
                                                                            : 'bg-gradient-to-br from-[#f8fafc] to-[#f1f5f9] border-slate-200 hover:border-slate-300'
                                                                    }`}
                                                                >
                                                                    <div className="absolute top-4 left-4 flex flex-col gap-1 z-30">
                                                                        <span className="text-[10px] bg-white/90 backdrop-blur-sm px-2.5 py-1.5 rounded-md font-bold shadow-sm text-slate-600 border border-slate-200/50 tracking-wide">
                                                                            {photo.exif_date}
                                                                        </span>
                                                                    </div>

                                                                    <div className="flex-1 flex items-center justify-center w-full h-full z-10 transition-transform duration-300 group-hover:scale-95">
                                                                        <div className={`p-4 rounded-2xl shadow-sm ${isMismatch ? 'bg-white/80 border border-[#fce9aa]/50' : 'bg-white/60 border border-slate-100/50'}`}>
                                                                            <span className="text-4xl drop-shadow-sm">{photo.emoji}</span>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {results.loose_matches.length > 0 && (
                                        <div className="flex flex-col gap-10 mt-4 border-t border-gray-100 pt-8">
                                            {Object.entries(
                                                results.loose_matches
                                                    .map(id => GALLERY_DB.find(p => String(p.id) === String(id)))
                                                    .filter(Boolean)
                                                    .reduce((acc, photo) => {
                                                        const dateStr = photo.exif_date.toUpperCase();
                                                        if (!acc[dateStr]) acc[dateStr] = [];
                                                        acc[dateStr].push(photo);
                                                        return acc;
                                                    }, {})
                                            ).map(([dateLabel, photos]) => (
                                                <div key={dateLabel}>
                                                    <h2 className="text-sm font-bold text-gray-500 mb-4 tracking-wide uppercase">
                                                        {dateLabel}
                                                    </h2>
                                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                                                        {photos.map((photo) => {
                                                            const isMismatch = ['WhatsApp Download', 'AirDrop'].includes(photo.source);
                                                            return (
                                                                <div 
                                                                    key={`loose-${photo.id}`} 
                                                                    className={`group relative aspect-square rounded-3xl flex flex-col border transition-all duration-300 shadow-sm hover:shadow-md hover:-translate-y-1 overflow-hidden ${
                                                                        isMismatch 
                                                                            ? 'bg-gradient-to-br from-[#fffdf5] to-[#fff4d1] border-[#fce9aa] hover:border-[#facc15]/50' 
                                                                            : 'bg-gradient-to-br from-[#f8fafc] to-[#f1f5f9] border-slate-200 hover:border-slate-300'
                                                                    }`}
                                                                >
                                                                    <div className="flex-1 flex items-center justify-center w-full h-full z-10 transition-transform duration-300 group-hover:scale-95">
                                                                        <div className={`p-4 rounded-2xl shadow-sm ${isMismatch ? 'bg-white/80 border border-[#fce9aa]/50' : 'bg-white/60 border border-slate-100/50'}`}>
                                                                            <span className="text-4xl drop-shadow-sm">{photo.emoji}</span>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <div className="flex flex-col gap-10 max-w-6xl">
                                    {Object.entries(
                                        GALLERY_DB.reduce((acc, photo) => {
                                            const dateStr = photo.exif_date.toUpperCase();
                                            if (!acc[dateStr]) acc[dateStr] = [];
                                            acc[dateStr].push(photo);
                                            return acc;
                                        }, {})
                                    )
                                    .sort(([dateA], [dateB]) => new Date(dateB) - new Date(dateA))
                                    .map(([dateLabel, photos]) => (
                                        <div key={`default-${dateLabel}`}>
                                            <h2 className="text-sm font-bold text-gray-600 mb-4 tracking-wide uppercase">
                                                {dateLabel}
                                            </h2>
                                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                                                {photos.map((photo) => {
                                                    const isMismatch = ['WhatsApp Download', 'AirDrop'].includes(photo.source);
                                                    return (
                                                        <div 
                                                            key={`default-photo-${photo.id}`} 
                                                            className={`group relative aspect-square rounded-3xl flex flex-col border transition-all duration-300 shadow-sm hover:shadow-md hover:-translate-y-1 overflow-hidden ${
                                                                isMismatch 
                                                                    ? 'bg-gradient-to-br from-[#fffdf5] to-[#fff4d1] border-[#fce9aa]' 
                                                                    : 'bg-gradient-to-br from-[#f8fafc] to-[#f1f5f9] border-slate-200'
                                                            }`}
                                                        >
                                                            <div className="absolute top-4 left-4 flex flex-col gap-1 z-30">
                                                                <span className="text-[10px] bg-white/90 backdrop-blur-sm px-2.5 py-1.5 rounded-md font-bold shadow-sm text-slate-600 border border-slate-200/50 tracking-wide">
                                                                    {photo.source}
                                                                </span>
                                                            </div>

                                                            <div className="flex-1 flex items-center justify-center w-full h-full z-10 transition-transform duration-300 group-hover:scale-95">
                                                                <div className={`p-4 rounded-2xl shadow-sm ${isMismatch ? 'bg-white/80 border border-[#fce9aa]/50' : 'bg-white/60 border border-slate-100/50'}`}>
                                                                    <span className="text-4xl drop-shadow-sm">{photo.emoji}</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
